version: '3.8'

services:
  pg-database:
    image: postgres:15-alpine
    container_name: pg-manager-db
    environment:
      - POSTGRES_DB=pg_manager_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  pg-manager-api:
    build:
      context: ./backend/pg-manager-api
      dockerfile: Dockerfile
    container_name: pg-manager-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://pg-database:5432/pg_manager_db
      - DB_USER=postgres
      - DB_PASS=password
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      - pg-database
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pg-data:
