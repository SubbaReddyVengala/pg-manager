spring:
  application:
    name: pg-manager-api
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pg_manager_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: dashboardStats
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4200}

server:
  port: 8080
  servlet:
    context-path: /api/v1

# JWT Security Properties (Flattened to match JwtUtil @Value)
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

# Service URLs for internal "Client" fallback (internal loopback)
auth-service:
  url: http://localhost:8080/api/v1
room-service:
  url: http://localhost:8080/api/v1
tenant-service:
  url: http://localhost:8080/api/v1
payment-service:
  url: http://localhost:8080/api/v1
notification-service:
  url: http://localhost:8080/api/v1

# Logging
logging:
  level:
    com.pgmanager.api: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
