server:
  port: 8083

spring:
  application:
    name: tenant-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/pgmanager?currentSchema=tenant_schema
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: tenant_schema
  flyway:
    enabled: true
    schemas: tenant_schema
    locations: classpath:db/migration
    default-schema: tenant_schema

# URL for room-service -- used by RoomServiceClient
room-service:
  url: http://127.0.0.1:8082
payment-service:
  url: http://127.0.0.1:8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

sentry:
  dsn: ${SENTRY_DSN:https://placeholder@sentry.io/placeholder}
  environment: ${SENTRY_ENVIRONMENT:production}
  traces-sample-rate: 0.1
  send-default-pii: false
