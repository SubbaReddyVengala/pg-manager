server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # PUBLIC auth routes - no JWT check
        - id: auth-public
          uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/auth/login,/api/auth/register,/api/auth/refresh
          filters:
            - StripPrefix=1

        # SECURED auth routes - JWT required
        - id: auth-secured
          uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - JwtValidation

        # Room, Tenant, Payment, etc.
        - id: settings-route
          uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/settings/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: room-service
          uri: ${ROOM_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/rooms/**
          filters:
            - StripPrefix=1
            - JwtValidation
            
        - id: tenant-service
          uri: ${TENANT_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/tenants/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8084}
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
            
        - id: report-service
          uri: ${REPORT_SERVICE_URL:http://127.0.0.1:8088}
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://127.0.0.1:8087}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

        - id: maintenance-service
          uri: ${MAINTENANCE_SERVICE_URL:http://127.0.0.1:8089}
          predicates:
            - Path=/api/maintenance/**
          filters:
            - StripPrefix=1
            - JwtValidation



jwt:
  secret: ${JWT_SECRET:pgmanager-dev-secret-subbu-2026-min-32-chars}

management:
  endpoints:
    web:
      exposure:
        include: health

