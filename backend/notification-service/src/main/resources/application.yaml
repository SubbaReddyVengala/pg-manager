server:
  port: 8087

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/pgmanager?currentSchema=notification_schema}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: notification_schema
    baseline-on-migrate: true
    
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_USER:dummy_user}
    password: ${BREVO_PASSWORD:dummy_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

twilio:
  account-sid: ${TWILIO_SID:AC_dummy}
  auth-token: ${TWILIO_TOKEN:dummy_token}
  from-number: ${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886} # Sandbox default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

sentry:
  dsn: ${SENTRY_DSN:https://placeholder@sentry.io/placeholder}
  environment: ${SENTRY_ENVIRONMENT:production}
  traces-sample-rate: 0.1
  send-default-pii: false
